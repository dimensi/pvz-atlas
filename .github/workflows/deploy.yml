name: Deploy PVZ Atlas

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-pvz-atlas
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"

      - name: Configure SSH
        env:
          VDS_SSH_PRIVATE_KEY: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          VDS_KNOWN_HOSTS: ${{ secrets.VDS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VDS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VDS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Restore environment on VPS
        env:
          PVZ_ENV_B64: ${{ secrets.PVZ_ENV_B64 }}
          VDS_HOST: ${{ secrets.VDS_HOST }}
        run: |
          printf '%s' "$PVZ_ENV_B64" \
            | base64 --decode \
            | ssh "root@$VDS_HOST" \
                'install -d -m 755 /opt/pvz-atlas && umask 077 && cat > /opt/pvz-atlas/.env'

      - name: Pull image on VPS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VDS_HOST: ${{ secrets.VDS_HOST }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | ssh "root@$VDS_HOST" docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          ssh "root@$VDS_HOST" docker pull "$IMAGE_NAME"

      - name: Deploy application
        env:
          APP_IMAGE: ${{ env.IMAGE_NAME }}
          DEPLOY_IMAGE_SOURCE: none
          SSH_HOST: root@${{ secrets.VDS_HOST }}
        run: bash scripts/deploy-home.sh
